[package]
name = "image-moz"
version = "0.1.0"
edition = "2024"

[dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
crossbeam-channel = "0.5.17"
directories = "6.0.0"
eframe = "0.35.0"
env_logger = "0.11.11"
glam = "0.34.3"
gltf = "1.4.1"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "bmp", "gif", "tiff", "exr", "hdr", "qoi"] }
log = "0.4.34"
notify = "8.2.1"
notify-debouncer-full = "0.7.0"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_NetworkManagement_WNet","Win32_Security", "Win32_Storage_FileSystem", "Win32_System_DataExchange", "Win32_System_IO", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_Pipes", "Win32_System_Threading", "Win32_UI_Shell", "Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile = "3.27.0"

# Decoders are far too slow unoptimized; keep our own code debuggable.
[profile.dev.package.image]
opt-level = 3

[profile.dev.package.png]
opt-level = 3

[profile.dev.package.fdeflate]
opt-level = 3

[profile.dev.package.miniz_oxide]
opt-level = 3

[profile.dev.package.zune-jpeg]
opt-level = 3

[profile.dev.package.zune-core]
opt-level = 3

[profile.dev.package.exr]
opt-level = 3

[profile.dev.package.tiff]
opt-level = 3

[profile.dev.package.image-webp]
opt-level = 3

[build-dependencies]
winresource = "0.1.34"
